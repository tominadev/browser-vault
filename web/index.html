<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser Vault</title><style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:900px;margin:0 auto;padding:28px 18px}.card{background:#fff;border:1px solid #e4eaf2;border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:0 8px 24px #1020400a}h1{margin:0 0 8px}.muted{color:#667085;font-size:14px}input{width:100%;padding:11px;margin:7px 0 14px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{border:0;border-radius:8px;background:#175cd3;color:#fff;padding:10px 14px;cursor:pointer}.error{color:#b42318;background:#fff1f0;padding:10px;border-radius:8px;margin:10px 0}.ok{color:#067647;background:#ecfdf3;padding:10px;border-radius:8px;margin:10px 0}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:12px 5px;border-bottom:1px solid #edf0f5;text-align:left}.progress{height:8px;background:#e7ecf3;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;background:#175cd3;width:0;transition:width .15s}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style></head><body><main class="shell"><div id="auth" class="card"><h1>Browser Vault</h1><p class="muted">Files are encrypted in your browser before upload.</p><div id="message"></div><form id="login-form"><h2>Sign in</h2><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form><hr><form id="register-form"><h2>Create account</h2><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" minlength="8" required><button>Create account</button></form></div><div id="app" class="hidden"><nav class="nav"><strong>Browser Vault</strong><div class="row"><span id="identity" class="muted"></span><button id="logout">Sign out</button></div></nav><section class="card"><h2>Upload file</h2><p class="muted">Encryption happens locally in this browser.</p><input id="file" type="file"><button id="upload">Encrypt and upload</button><div id="progress" class="hidden"><div id="progress-label" class="muted"></div><div class="progress"><div id="bar" class="bar"></div></div></div></section><section class="card"><h2>My files</h2><table><thead><tr><th>Name</th><th>Size</th><th>Action</th></tr></thead><tbody id="files"></tbody></table></section></div></main><script>
const enc=new TextEncoder();let sessionKey=null,adminPrivateKey=null,username='',me=null;
const b64=b=>{let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const random=n=>crypto.getRandomValues(new Uint8Array(n));
async function derive(password,salt,domain){const base=await crypto.subtle.importKey('raw',enc.encode(domain+password),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},base,256))}
async function aesKey(raw){return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt'])}
async function seal(key,plain){const nonce=random(12);const data=await crypto.subtle.encrypt({name:'AES-GCM',iv:nonce},key,plain);return {nonce:b64(nonce),data:b64(data)}}
async function open(key,box){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.nonce)},key,unb64(box.data)))}
function message(text,error=false){const el=document.getElementById('message');el.className=error?'error':'ok';el.textContent=text}
async function authInfo(user){const r=await fetch('/api/auth-info?username='+encodeURIComponent(user));if(!r.ok)throw Error('User not found');return r.json()}
async function login(event){event.preventDefault();const f=new FormData(event.target);username=f.get('username').trim();const password=f.get('password');try{const info=await authInfo(username);const salt=unb64(info.salt);const verifier=b64(await derive(password,salt,'auth:'));const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({Username:username,AuthVerifier:verifier})});if(!r.ok)throw Error('Invalid username or password');me=await (await fetch('/api/me')).json();const passwordKey=await aesKey(await derive(password,salt,'password-wrap:'));const userRaw=await open(passwordKey,JSON.parse(me.encrypted_user_key));sessionKey=await aesKey(userRaw);adminPrivateKey=me.admin?await crypto.subtle.importKey('pkcs8',await open(passwordKey,JSON.parse(me.encrypted_private_key)),{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']):null;showApp()}catch(e){message(e.message,true)}}
async function register(event){event.preventDefault();const f=new FormData(event.target);username=f.get('username').trim();const password=f.get('password');try{const salt=random(16);const passwordKey=await aesKey(await derive(password,salt,'password-wrap:'));const userRaw=random(32);const verifier=b64(await derive(password,salt,'auth:'));const pair=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);const publicKey=b64(await crypto.subtle.exportKey('spki',pair.publicKey));const privateKey=await crypto.subtle.exportKey('pkcs8',pair.privateKey);const privateBox=await seal(passwordKey,privateKey);const userBox=await seal(passwordKey,userRaw);const admins=await (await fetch('/api/admin-keys')).json();const adminWraps={};for(const [name,keyData] of Object.entries(admins)){const key=await crypto.subtle.importKey('spki',unb64(keyData),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);adminWraps[name]=b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},key,userRaw))}const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({Username:username,Salt:b64(salt),AuthVerifier:verifier,PublicKey:publicKey,EncryptedUserKey:JSON.stringify(userBox),EncryptedPrivateKey:JSON.stringify(privateBox),AdminWraps:adminWraps})});if(!r.ok)throw Error((await r.json()).error||'Registration failed');me=await (await fetch('/api/me')).json();sessionKey=await aesKey(userRaw);adminPrivateKey=me.admin?await crypto.subtle.importKey('pkcs8',privateKey,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']):null;showApp()}catch(e){message(e.message,true)}}
function showApp(){document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('identity').textContent=username+' · '+(me&&me.admin?'Administrator':'User');if(!document.getElementById('password-form')){const section=document.createElement('section');section.className='card';section.innerHTML='<h2>Account</h2><p class="muted">Change your password. Your encrypted file keys stay the same.</p><form id="password-form" class="row"><input name="current" type="password" placeholder="Current password" required><input name="next" type="password" placeholder="New password" minlength="8" required><button>Change password</button></form>';document.getElementById('app').prepend(section);document.getElementById('password-form').onsubmit=changePassword}if(me&&me.admin)loadAdminPanel();loadFiles()}
async function loadAdminPanel(){const users=await (await fetch('/api/admin/users')).json();if(document.getElementById('admin-panel'))return;const section=document.createElement('section');section.id='admin-panel';section.className='card';section.innerHTML='<h2>Administrator</h2><p class="muted">User key packages are opened only in this browser with your unlocked administrator key.</p><table><thead><tr><th>User</th><th>Role</th><th>Action</th></tr></thead><tbody>'+users.map(u=>`<tr><td>${u.username}</td><td>${u.admin?'Administrator':'User'}</td><td><button data-owner="${encodeURIComponent(u.username)}">View files</button></td></tr>`).join('')+'</tbody></table><div id="admin-files"></div>';document.getElementById('app').prepend(section);section.querySelectorAll('button').forEach(b=>b.onclick=()=>showAdminFiles(decodeURIComponent(b.dataset.owner)))}
async function showAdminFiles(owner){const box=document.getElementById('admin-files');try{const files=await (await fetch('/api/admin/files?owner='+encodeURIComponent(owner))).json();box.innerHTML='<h3>'+owner+' files</h3>'+files.map(f=>`<p>${f.name} (${f.size} bytes) <button data-id="${f.id}" data-name="${f.name}">Download</button></p>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>adminDownload(b.dataset.id,b.dataset.name,owner))}catch(e){box.textContent=e.message}}
async function adminDownload(id,name,owner){const files=await (await fetch('/api/admin/files?owner='+encodeURIComponent(owner))).json(),meta=files.find(x=>x.id===id),pack=JSON.parse(atob(meta.key_package)),wrapped=pack.adminWraps[username];if(!wrapped)throw Error('This file has no key package for the current administrator');const raw=new Uint8Array(await crypto.subtle.decrypt({name:'RSA-OAEP'},adminPrivateKey,unb64(wrapped))),key=await aesKey(raw),response=await fetch('/api/files/'+id+'?admin=1');if(!response.ok)throw Error('Download failed');const reader=response.body.getReader();let pending=new Uint8Array(0),parts=[];while(true){const part=await reader.read();if(part.done)break;pending=joinBytes(pending,part.value);while(pending.length>=16){const size=new DataView(pending.buffer,pending.byteOffset,4).getUint32(0);if(pending.length<16+size)break;parts.push(await crypto.subtle.decrypt({name:'AES-GCM',iv:pending.slice(4,16)},key,pending.slice(16,16+size)));pending=pending.slice(16+size)}}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(parts));a.download=name;a.click()}
async function changePassword(event){event.preventDefault();const f=new FormData(event.target),current=f.get('current'),next=f.get('next');try{const info=await authInfo(username),oldSalt=unb64(info.salt),oldKey=await aesKey(await derive(current,oldSalt,'password-wrap:')),raw=await open(oldKey,JSON.parse(me.encrypted_user_key)),privateRaw=await open(oldKey,JSON.parse(me.encrypted_private_key)),salt=random(16),newKey=await aesKey(await derive(next,salt,'password-wrap:')),body={Salt:b64(salt),AuthVerifier:b64(await derive(next,salt,'auth:')),EncryptedUserKey:JSON.stringify(await seal(newKey,raw)),EncryptedPrivateKey:JSON.stringify(await seal(newKey,privateRaw))},r=await fetch('/api/account/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error((await r.json()).error||'Password change failed');me.salt=body.Salt;me.auth_verifier=body.AuthVerifier;me.encrypted_user_key=body.EncryptedUserKey;me.encrypted_private_key=body.EncryptedPrivateKey;message('Password changed successfully')}catch(e){message(e.message,true)}}
function joinBytes(a,b){const out=new Uint8Array(a.length+b.length);out.set(a);out.set(b,a.length);return out}
async function upload(){const input=document.getElementById('file');if(!input.files.length)return message('Choose a file first',true);const file=input.files[0],progress=document.getElementById('progress'),bar=document.getElementById('bar'),label=document.getElementById('progress-label');progress.classList.remove('hidden');label.textContent='Encrypting locally…';bar.style.width='0%';const raw=random(32),key=await aesKey(raw),chunkSize=4*1024*1024,userWrap=await seal(sessionKey,raw);const admins=await (await fetch('/api/admin-keys')).json();const adminWraps={};for(const [name,keyData] of Object.entries(admins)){const adminKey=await crypto.subtle.importKey('spki',unb64(keyData),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);adminWraps[name]=b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},adminKey,raw))}const packageData={chunkSize,plainSize:file.size,userWrap,adminWraps};let offset=0;const stream=new ReadableStream({async pull(controller){if(offset>=file.size){controller.close();return}const end=Math.min(offset+chunkSize,file.size),plain=await file.slice(offset,end).arrayBuffer(),nonce=random(12),ciphertext=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:nonce},key,plain)),frame=new Uint8Array(4+nonce.length+ciphertext.length);new DataView(frame.buffer).setUint32(0,ciphertext.length);frame.set(nonce,4);frame.set(ciphertext,16);offset=end;bar.style.width=Math.round(offset/file.size*70)+'%';label.textContent='Encrypting chunk '+Math.ceil(offset/chunkSize)+'…';controller.enqueue(frame)}});label.textContent='Uploading ciphertext…';const r=await fetch('/api/files',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-File-Name':encodeURIComponent(file.name),'X-Key-Package':btoa(JSON.stringify(packageData))},body:stream,duplex:'half'});if(!r.ok)throw Error((await r.json()).error||'Upload failed');bar.style.width='100%';label.textContent='Upload complete';await loadFiles()}
async function loadFiles(){const r=await fetch('/api/files');if(!r.ok)return;const files=await r.json();document.getElementById('files').innerHTML=files.map(f=>`<tr><td>${f.name}</td><td>${f.size} bytes</td><td><button data-id="${f.id}" data-name="${f.name}">Download</button></td></tr>`).join('');document.querySelectorAll('#files button').forEach(b=>b.onclick=()=>download(b.dataset.id,b.dataset.name))}
async function download(id,name){const meta=(await (await fetch('/api/files')).json()).find(x=>x.id===id),pack=JSON.parse(atob(meta.key_package)),raw=await open(sessionKey,pack.userWrap),key=await aesKey(raw),response=await fetch('/api/files/'+id);if(!response.ok||!response.body)throw Error('Download failed');const reader=response.body.getReader();let pending=new Uint8Array(0),parts=[],loaded=0,total=Number(response.headers.get('Content-Length'))||meta.size;while(true){const part=await reader.read();if(part.done)break;pending=joinBytes(pending,part.value);while(pending.length>=16){const size=new DataView(pending.buffer,pending.byteOffset,4).getUint32(0);if(pending.length<16+size)break;const nonce=pending.slice(4,16),ciphertext=pending.slice(16,16+size);parts.push(await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce},key,ciphertext));pending=pending.slice(16+size);loaded+=size;document.getElementById('progress').classList.remove('hidden');document.getElementById('progress-label').textContent='Decrypting download…';document.getElementById('bar').style.width=total?Math.round(loaded/total*100)+'%':'60%'}}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(parts));a.download=name;a.click();document.getElementById('progress-label').textContent='Download complete';document.getElementById('bar').style.width='100%'}
document.getElementById('login-form').onsubmit=login;document.getElementById('register-form').onsubmit=register;document.getElementById('upload').onclick=()=>upload().catch(e=>message(e.message,true));document.getElementById('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.reload()};
</script></body></html>
